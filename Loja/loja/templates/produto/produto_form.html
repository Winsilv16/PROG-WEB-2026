{% extends 'base.html' %}
{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <h2 class="mb-4">{% if produto.id %}Editar Produto{% else %}Inserir Produto{% endif %}</h2>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group row">
            <label class="col-sm-3 col-form-label font-weight-bold">Produto</label>
            <div class="col-sm-9">
                <input type="text" name="produto" class="form-control" value="{{ produto.produto|default:'' }}" required>
            </div>
        </div>

        <div class="form-group row ml-1">
            <div class="form-check mr-3">
                <input type="checkbox" name="destaque" class="form-check-input" id="destaque" {% if produto.destaque %}checked{% endif %}>
                <label class="form-check-label font-weight-bold" for="destaque">✔ Destaque</label>
            </div>
            <div class="form-check">
                <input type="checkbox" name="promocao" class="form-check-input" id="promocao" {% if produto.promocao %}checked{% endif %}>
                <label class="form-check-label font-weight-bold" for="promocao">✔ Promoção</label>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label font-weight-bold">Msg Promoção</label>
            <div class="col-sm-9">
                <input type="text" name="msg_promocao" class="form-control" value="{{ produto.msg_promocao|default:'' }}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label font-weight-bold">Preço</label>
            <div class="col-sm-9">
                <input type="number" step="0.01" name="preco" class="form-control" value="{{ produto.preco|default:'0.00' }}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label font-weight-bold">Categorias</label>
            <div class="col-sm-9">
                <select name="categoria" class="form-control">
                    <option value="">---------</option>
                    {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if produto.categoria.id == cat.id %}selected{% endif %}>{{ cat.categoria }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label font-weight-bold">Fabricantes</label>
            <div class="col-sm-9">
                <select name="fabricante" class="form-control">
                    <option value="">---------</option>
                    {% for fab in fabricantes %}
                        <option value="{{ fab.id }}" {% if produto.fabricante.id == fab.id %}selected{% endif %}>{{ fab.fabricante }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label font-weight-bold">Imagem</label>
            <div class="col-sm-9">
                {% if produto.image %}
                    <div class="mb-2">
                        <img src="{{ produto.image.url }}" alt="Imagem do Produto" class="img-thumbnail" style="max-height: 150px;">
                    </div>
                {% endif %}
                <input type="file" name="image" class="form-control-file">
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-danger mr-2 font-weight-bold">✔ Salvar</button>
            <a href="{% url 'produto' %}" class="btn btn-secondary font-weight-bold">🔄 Retornar</a>
        </div>
    </form>
</div>
{% endblock %}
