{% extends 'base.html' %}
{% load static %}

{% block title %}- Home{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="jumbotron bg-light shadow-sm text-center">
        <h1 class="display-4 font-weight-bold">Bem-vindo à nossa Loja!</h1>
        <p class="lead text-muted">Encontre os melhores produtos pelos melhores preços.</p>
        <hr class="my-4">
        
        <form action="{% url 'home' %}" method="GET" class="form-inline justify-content-center">
            <input class="form-control mr-sm-2 w-50" type="search" name="search" placeholder="Buscar produtos..." aria-label="Search">
            <button class="btn btn-outline-success my-2 my-sm-0" type="submit"><i class="fa fa-search"></i> Buscar</button>
        </form>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title font-weight-bold">Conheça nosso Catálogo</h5>
                    <p class="card-text text-muted flex-grow-1">Veja todos os produtos que separamos para você hoje.</p>
                    <a href="{% url 'home' %}" class="btn btn-primary btn-card mt-auto">Acessar</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
